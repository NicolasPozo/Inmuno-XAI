<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Immuno-XAI</title>
<meta name="description" content="Dos relojes de edad biológica, inmunológico y epigenético, explicados paciente por paciente.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%233a17e6'/%3E%3Cpath d='M16 8v8l5 3' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  /* Variables que el dashboard de Claude le da a la página; aquí se definen a mano, en claro y oscuro */
  :root {
    color-scheme: light;
    --font-anthropic-sans: 'Work Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 12px; --cds-gap-lg: 20px;
    --cds-pad-xs: 4px; --cds-pad-sm: 8px; --cds-pad-md: 12px; --cds-pad-lg: 16px; --cds-radius: 10px;
    --cds-font-size-caption: 13px; --cds-font-weight-medium: 600; --cds-dur-slow: .3s;
    --color-fg: #18181b; --color-fg-muted: #66666e; --color-bg: #ffffff; --color-panel: #f3f3f5;
    --color-border-line: #e4e4e8; --color-bad: #d03b3b;
    --cds-chart-muted: #b8b8c0; --cds-chart-grid: #ececf0; --cds-chart-axis: #c8c8d0; --cds-chart-reference: #85858f;
    --cds-surface-popover: #ffffff; --cds-border: #dcdce2; --cds-shadow-popover: 0 6px 20px rgba(0, 0, 0, .12);
    --cds-text-secondary: #66666e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --color-fg: #ececef; --color-fg-muted: #a1a1aa; --color-bg: #141416; --color-panel: #1e1e21;
      --color-border-line: #2e2e33; --color-bad: #f06464;
      --cds-chart-muted: #55555e; --cds-chart-grid: #2a2a2f; --cds-chart-axis: #44444c; --cds-chart-reference: #8a8a94;
      --cds-surface-popover: #232327; --cds-border: #3a3a40; --cds-shadow-popover: 0 6px 20px rgba(0, 0, 0, .5);
      --cds-text-secondary: #a1a1aa;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --color-fg: #ececef; --color-fg-muted: #a1a1aa; --color-bg: #141416; --color-panel: #1e1e21;
    --color-border-line: #2e2e33; --color-bad: #f06464;
    --cds-chart-muted: #55555e; --cds-chart-grid: #2a2a2f; --cds-chart-axis: #44444c; --cds-chart-reference: #8a8a94;
    --cds-surface-popover: #232327; --cds-border: #3a3a40; --cds-shadow-popover: 0 6px 20px rgba(0, 0, 0, .5);
    --cds-text-secondary: #a1a1aa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--color-panel); color: var(--color-fg); font-family: var(--font-anthropic-sans); }
  #dash-root { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding: 16px 16px 48px; }

  /* Fondo animado en los bordes vacíos: células (inmunológico) o ADN (epigenético) */
  .fondo { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .fondo-capa { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity .9s ease; }
  .fondo-capa.activo { opacity: 1; }
  .dash-skeleton { background: color-mix(in srgb, var(--color-fg) 6%, transparent); border-radius: 12px; animation: esqueleto 1.4s ease-in-out infinite alternate; }
  @keyframes esqueleto { to { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .dash-skeleton { animation: none; } }

  /* Botón de tema (claro / oscuro) */
  .tema { position: fixed; right: 16px; bottom: 16px; z-index: 50; width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid var(--cds-border); background: var(--color-bg); color: var(--color-fg); cursor: pointer;
    display: grid; place-items: center; box-shadow: var(--cds-shadow-popover); }
  .tema:focus-visible { outline: 2px solid #3a17e6; outline-offset: 2px; }
  .tema svg { width: 20px; height: 20px; }
  .tema .luna { display: none; }
  :root[data-theme="dark"] .tema .sol { display: none; }
  :root[data-theme="dark"] .tema .luna { display: block; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .tema .sol { display: none; }
    :root:not([data-theme="light"]) .tema .luna { display: block; }
  }
  .sin-script { max-width: 40rem; margin: 20vh auto; padding: 0 16px; text-align: center; color: var(--color-fg-muted); }

  /* Barra de arriba: volver a la portada y pasar al otro reloj */
  .barra { position: relative; z-index: 2; max-width: 1240px; margin: 0 auto; padding: 16px 16px 0;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .marca { display: inline-flex; align-items: center; gap: 10px; color: var(--color-fg); text-decoration: none; font-weight: 500; font-size: 15px; letter-spacing: -0.01em;
    padding: 6px 14px 6px 6px; border-radius: 999px; transition: background .2s; }
  .marca:hover { background: color-mix(in srgb, var(--color-fg) 6%, transparent); }
  .marca svg { width: 26px; height: 26px; flex: none; }
  .marca .volver { color: var(--color-fg-muted); font-weight: 400; }
  .relojes { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: #141416; border: 1px solid color-mix(in srgb, var(--color-fg) 8%, transparent); }
  .relojes a { color: rgba(255, 255, 255, 0.72); text-decoration: none; font-size: 14px; padding: 8px 16px; border-radius: 999px; transition: color .2s, background .2s; }
  .relojes a:hover { color: #fff; }
  .relojes a[aria-current="page"] { background: #3a17e6; color: #fff; }
  .barra a:focus-visible { outline: 2px solid #3a17e6; outline-offset: 2px; }
  @media (max-width: 520px) { .marca .volver { display: none; } .relojes a { padding: 7px 12px; font-size: 13px; } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="estaticos/dash-local.js"></script>
</head>
<body>
<noscript><p class="sin-script">Esta página necesita JavaScript.</p></noscript>
<div class="fondo" aria-hidden="true">
  <canvas class="fondo-capa" data-fondo="inmuno"></canvas>
  <canvas class="fondo-capa" data-fondo="epi"></canvas>
</div>
<header class="barra">
  <a class="marca" href="./">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#3a17e6"/><path d="M16 8v8l5 3" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
    Immuno-XAI <span class="volver">· Portada</span>
  </a>
  <nav class="relojes" aria-label="Relojes">
    <a href="inmunologico" data-pagina="inmuno">Reloj inmunológico</a>
    <a href="epigenetico" data-pagina="epi">Reloj epigenético</a>
  </nav>
</header>
<div id="dash-root"></div>
<button class="tema" type="button" id="tema" aria-label="Cambiar entre tema claro y oscuro">
  <svg class="sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>
<script>
  // Fuera de Claude la página puede calcular pacientes nuevos con el servidor Python
  window.EI_API = 'api';
  window.EI_VIDEO = 'media/Loading%20screen.mp4';
  // Cada reloj es una página: /inmunologico o /epigenetico. El dashboard muestra solo ese modelo.
  window.EI_PAGINA = /epigenetico/.test(location.pathname) ? 'epi' : 'inmuno';
  document.title = window.EI_PAGINA === 'epi' ? 'Reloj epigenético · Immuno-XAI' : 'Reloj inmunológico · Immuno-XAI';
  document.querySelectorAll('.relojes a').forEach((a) => {
    if (a.dataset.pagina === window.EI_PAGINA) a.setAttribute('aria-current', 'page');
  });

  // Tema: el del sistema, salvo que la persona lo cambie con el botón
  const html = document.documentElement;
  try { const t = localStorage.getItem('ei-tema'); if (t === 'light' || t === 'dark') html.dataset.theme = t; } catch (e) { /* nada */ }
  document.getElementById('tema').addEventListener('click', () => {
    const ahora = html.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    html.dataset.theme = ahora === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('ei-tema', html.dataset.theme); } catch (e) { /* nada */ }
    window.redibujarDashboard();
    window.fondoRevisar?.();
  });

  window.cargarDashboard(document.getElementById('dash-root'), 'dashboard.html').catch((e) => {
    console.error(e);
    document.getElementById('dash-root').innerHTML = '<p class="sin-script">No se pudo cargar el dashboard.</p>';
  });
</script>
<script src="estaticos/fondo.js"></script>
</body>
</html>
